[package]
name = "gamehub"
version = "0.1.0"
description = "GameHub - unified game launcher for Linux"
edition = "2021"
rust-version = "1.90"

[lib]
name = "gamehub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex = "1"
flate2 = "1"
tar = "0.4"
xz2 = "0.1"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
libc = "0.2"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
